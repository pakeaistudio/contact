<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Link Saya</title>
    <style>
        /* Gaya Desain Halaman */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e24, #2a2b3d);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        /* Gaya Desain Tombol */
        .link-btn {
            display: block;
            background-color: #ffffff;
            color: #1e1e24;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        .link-btn:hover {
            transform: scale(1.03);
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Gantilah teks di bawah ini dengan nama & bio Anda -->
        <h1>@NamaAnda</h1>
        <p>Selamat datang di portal link resmi saya.</p>

        <!-- Gantilah URL di bawah ini dengan link media sosial Anda -->
        <a class="link-btn" href="https://instagram.com" target="_blank">Instagram</a>
        <a class="link-btn" href="https://tiktok.com" target="_blank">TikTok</a>
        <a class="link-btn" href="https://wa.me" target="_blank">WhatsApp Chat</a>
    </div>

</body>
</html>
